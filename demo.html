<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPX -> Map Silhouette API Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: #f5f5f5;
        padding: 2rem;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #333;
        margin-bottom: 1rem;
      }
      h2 {
        color: #666;
        margin-top: 2rem;
        margin-bottom: 1rem;
      }
      .button {
        background: #b7d05b;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 500;
        transition: background 0.2s;
      }
      .button:hover {
        background: #a0ba4a;
      }
      .button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .status {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: 4px;
        background: #f0f0f0;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
      }
      .image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
      }
      .image-card {
        border-radius: 10px;
        padding: 1rem;
        background: white;
        text-align: center;
        align-content: center;
        aspect-ratio: 1;
        box-shadow: #ccc 1px 1px 24px 0px;
      }
      .image-card img {
        max-width: 100%;
        height: auto;
        border-radius: 4px;
      }
      .image-card .filename {
        font-size: 0.85rem;
        color: #666;
        margin-top: 0.5rem;
        word-break: break-all;
      }
      pre {
        background: #f4f4f4;
        padding: 1rem;
        border-radius: 4px;
        overflow-x: auto;
        font-size: 0.875rem;
      }
      .endpoint {
        margin-bottom: 2rem;
      }
      .endpoint-header {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      code {
        background: #f4f4f4;
        padding: 0.2rem 0.4rem;
        border-radius: 3px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>GPX to Map Silhouette API</h1>

      <div class="endpoint">
        <div class="endpoint-header">
          <button class="button" onclick="getAllImages()">Refresh</button>
          <button class="button" onclick="generateAllImages()">
            Generate All Images
          </button>
          <code>POST /images/generate</code>
        </div>
        <div id="generateStatus"></div>
      </div>

      <div class="endpoint">
        <div id="imageList">Loading...</div>
      </div>
    </div>

    <script>
      const API_BASE = "http://localhost:3000";

      async function refresh() {
        const images = await getAllImages();
        console.log("Loaded images:", images);

        // Convert image filenames to results format
        const results = images.map((filename) => ({
          success: true,
          outputImage: filename,
        }));

        loadImageList({ results });
      }

      async function getAllImages() {
        try {
          const response = await fetch(`${API_BASE}/images`, {
            method: "GET",
          });
          const data = await response.json();
          return data.images;
        } catch (error) {
          console.error("Error fetching images:", error);
          return [];
        }
      }

      async function generateAllImages() {
        const statusEl = document.getElementById("generateStatus");
        statusEl.className = "status";
        statusEl.innerHTML = "Generating images...";

        try {
          const response = await fetch(`${API_BASE}/images/generate`, {
            method: "POST",
          });
          const data = await response.json();

          statusEl.className = "status success";
          statusEl.innerHTML = `
                    <strong>Success!</strong>
                    Generated ${data.summary.successful} of ${data.summary.total} images<br>
                    <small>${data.summary.failed > 0 ? `${data.summary.failed} failed` : ""}</small>
                `;

          // Refresh the image list
          loadImageList(data);
        } catch (error) {
          statusEl.className = "status error";
          statusEl.innerHTML = `<strong>Error:</strong> ${error.message}`;
        }
      }

      async function loadImageList(data) {
        const listEl = document.getElementById("imageList");

        try {
          // First generate to ensure we have images
          //   const response = await fetch(`${API_BASE}/images/generate`, {
          //     method: "POST",
          //   });
          //   const data = await response.json();

          if (data.results.length === 0) {
            listEl.innerHTML = "<p>No SVG files found</p>";
            return;
          }

          // Create image grid
          listEl.innerHTML = '<div class="image-grid"></div>';
          const grid = listEl.querySelector(".image-grid");

          data.results.forEach((result) => {
            if (result.success) {
              const card = document.createElement("div");
              card.className = "image-card";
              card.innerHTML = `
                            <img src="${API_BASE}/images/${result.outputImage}" alt="${result.outputImage}" title="${result.outputImage}" />
                        `;
              grid.appendChild(card);
            }
          });
        } catch (error) {
          listEl.innerHTML = `<div class="status error">Error loading images: ${error.message}</div>`;
        }
      }

      // Get images on page load
      (async () => {
        await refresh();
      })();
    </script>
  </body>
</html>
